name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize]

# Nothing here writes to the repository, so start from zero and grant per job.
permissions: {}

# Titles follow conventional commits because we squash-merge, so the PR title
# becomes the commit message and the changelog writes itself. Scopes are
# optional; this is a single package, so requiring them would only be friction.
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert

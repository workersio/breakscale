<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Every number in the interface renders in a monospace font stack, which is
  a list of system font names. Which of those names a Linux box can actually
  serve decides the shape of the digits, and Linux boxes disagree: a stock
  WSL2 Ubuntu has no Liberation Mono, so the stack lands on DejaVu Sans
  Mono, while a GitHub runner has Liberation Mono installed and lands there.
  Strong-binding every family in the stack (plus the generic monospace
  alias) to DejaVu Sans Mono makes the numeric readouts render identically
  on any Linux host, which is what lets the committed linux baselines match
  CI. Shared by the visual CI job (.github/workflows/ci.yml) and the WSL2
  recipe in tests/visual/README.md. Windows is unaffected: Consolas exists
  there and matches before this file is consulted.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SFMono-Regular</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Consolas</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
</fontconfig>
